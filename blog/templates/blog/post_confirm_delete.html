{% extends 'blog/base.html' %}

{% block title %}게시글 삭제 - My Blog{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 text-center p-4">
                <i class="bi bi-trash text-danger mb-3" style="font-size: 3rem;"></i>
                <h4 class="fw-bold mb-3">게시글 삭제</h4>
                <p class="text-muted"><strong>{{ post.title }}</strong><br>이 게시글을 삭제할까요? 되돌릴 수 없습니다.</p>
                <form method="post" class="d-flex gap-2 justify-content-center mt-3">
                    {% csrf_token %}
                    <a href="{{ post.get_absolute_url }}" class="btn btn-outline-secondary">취소</a>
                    <button type="submit" class="btn btn-danger">삭제</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
