{% extends 'blog/base.html' %}

{% block title %}로그인 - My Blog{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h4 class="fw-bold text-center mb-4">
                        <i class="bi bi-person-circle me-2"></i>로그인
                    </h4>
                    <form method="post">
                        {% csrf_token %}
                        {% if form.errors %}
                        <div class="alert alert-danger">아이디 또는 비밀번호가 올바르지 않습니다.</div>
                        {% endif %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">아이디</label>
                            <input type="text" name="username" class="form-control" placeholder="아이디 입력" autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">비밀번호</label>
                            <input type="password" name="password" class="form-control" placeholder="비밀번호 입력">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right me-1"></i>로그인
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
