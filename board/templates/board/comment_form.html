{% extends 'blog/base.html' %}

{% block title %}댓글 수정 - 게시판{% endblock %}

{% block content %}
<div class="container py-4" style="max-width:600px;">
    <h2 style="font-size:1.1rem; font-weight:700; color:var(--text); margin-bottom:20px;">
        <i class="bi bi-chat-dots me-2" style="color:var(--accent);"></i>댓글 수정
    </h2>

    <form method="post" class="card-d p-4">
        {% csrf_token %}
        <div class="mb-4">
            {{ form.content }}
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn-p">
                <i class="bi bi-check-lg"></i>수정하기
            </button>
            <a href="{% url 'board:post_detail' comment.post.pk %}" class="btn-s">취소</a>
        </div>
    </form>
</div>
{% endblock %}
